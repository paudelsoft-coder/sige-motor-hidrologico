name: Motor hidrológico SIGE

on:
  # Los horarios los maneja el reloj de Cloudflare (Worker "sige-motor-reloj", cada 10 min), que dispara
  # este workflow con la tarea que corresponde: rapida / todo (10:40) / calibrar (lunes 03:10).
  # GitHub no garantiza sus propios horarios programados, por eso no se usan.
  workflow_dispatch:
    inputs:
      tarea:
        description: "rapida | todo | calibrar | historia | analogos | evaluar | ingesta | represas | pronostico | transito | primera-carga | glofas | calibrar_glofas | evaluar_prueba | calibrar_uruguay | evaluar_uruguay | uruguay | prefectura | auditar | auditar_borrar | evaluar_cruces | cuencas | mejorar"
        default: "todo"

concurrency:
  group: motor
  cancel-in-progress: false

jobs:
  motor:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Primera carga (3 años de alturas) y calibración
        if: github.event.inputs.tarea == 'primera-carga'
        run: |
          python -m motor ingesta --dias 1100
          python -m motor represas --desde 2023
          python -m motor calibrar
          python -m motor pronostico
      - name: Recalibrar (lunes)
        if: github.event.schedule == '10 6 * * 1' || github.event.inputs.tarea == 'calibrar'
        run: |
          python -m motor calibrar
          python -m motor transito
      - name: Revisión rápida (solo recalcula si el INA publicó datos nuevos)
        if: github.event.schedule == '*/10 10-15 * * *' || github.event.schedule == '7 0-9,16-23 * * *' || github.event.inputs.tarea == 'rapida'
        run: python -m motor rapida
      - name: Alturas + represas + pronóstico (una vez por día)
        if: github.event.schedule == '41 13 * * *' || github.event.inputs.tarea == 'todo' || github.event.inputs.tarea == ''
        run: python -m motor todo
      - name: Tarea puntual
        if: contains(fromJSON('["ingesta","represas","pronostico","transito","historia","analogos","evaluar","glofas","calibrar_glofas","evaluar_prueba","calibrar_uruguay","evaluar_uruguay","uruguay","prefectura","auditar","auditar_borrar","evaluar_cruces","cuencas","mejorar"]'), github.event.inputs.tarea)
        run: python -m motor ${{ github.event.inputs.tarea }}
