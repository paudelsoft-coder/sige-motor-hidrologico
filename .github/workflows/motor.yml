name: Motor hidrológico SIGE

on:
  schedule:
    - cron: "*/10 10-15 * * *"        # 07:00 a 12:50 (Argentina), cada 10 min: el INA carga las alturas del día
    - cron: "7 0-9,16-23 * * *"       # resto del día, cada hora: correcciones tardías
    - cron: "41 13 * * *"             # 10:41 (Argentina): todo (40 días de alturas + represas + pronóstico)
    - cron: "10 6 * * 1"     # lunes 03:10 (Argentina): recalibración con 3 años
  workflow_dispatch:
    inputs:
      tarea:
        description: "rapida | ingesta | represas | pronostico | calibrar | transito | todo | primera-carga"
        default: "todo"

concurrency:
  group: motor
  cancel-in-progress: false

jobs:
  motor:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Primera carga (3 años de alturas) y calibración
        if: github.event.inputs.tarea == 'primera-carga'
        run: |
          python -m motor ingesta --dias 1100
          python -m motor represas --desde 2023
          python -m motor calibrar
          python -m motor pronostico
      - name: Recalibrar (lunes)
        if: github.event.schedule == '10 6 * * 1' || github.event.inputs.tarea == 'calibrar'
        run: |
          python -m motor calibrar
          python -m motor transito
      - name: Revisión rápida (solo recalcula si el INA publicó datos nuevos)
        if: github.event.schedule == '*/10 10-15 * * *' || github.event.schedule == '7 0-9,16-23 * * *' || github.event.inputs.tarea == 'rapida'
        run: python -m motor rapida
      - name: Alturas + represas + pronóstico (una vez por día)
        if: github.event.schedule == '41 13 * * *' || github.event.inputs.tarea == 'todo' || github.event.inputs.tarea == ''
        run: python -m motor todo
      - name: Tarea puntual
        if: contains(fromJSON('["ingesta","represas","pronostico","transito"]'), github.event.inputs.tarea)
        run: python -m motor ${{ github.event.inputs.tarea }}
